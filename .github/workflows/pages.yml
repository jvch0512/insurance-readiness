name: pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install && npm run build
      - name: Assemble static site
        run: |
          mkdir _site
          cp -r public/. _site/
          mkdir _site/lib && cp -r dist/src/. _site/lib/
          [ -d examples ] && cp -r examples _site/examples || true
          sed -i 's#"/lib/#"./lib/#g; s#"/examples/#"./examples/#g; s#`/examples/#`./examples/#g' _site/app.js
          rm -f _site/lib/server-main.js _site/lib/cli.js
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
